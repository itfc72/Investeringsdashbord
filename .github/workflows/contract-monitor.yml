name: Contract monitor

on:
  workflow_dispatch:
  schedule:
    # 07:30 and 15:30 Europe/Oslo.
    # GitHub cron runs in UTC, so these anchors are 05:30 and 13:30 UTC.
    # DST can shift the local execution by one hour; the Python script itself uses Europe/Oslo.
    - cron: "30 5 * * *"
    - cron: "30 13 * * *"

permissions:
  contents: write

jobs:
  monitor-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run contract monitor
        run: python scripts/update_contract_monitor.py

      - name: Commit changes if any
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "investment-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/contract_monitor.json data/daily_updates.json
          git commit -m "Auto-update contract monitor"
          git push
